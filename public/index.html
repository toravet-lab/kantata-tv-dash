<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Command Center / Frankel Agency</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #121212;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .dashboard-wrapper {
            display: flex;
            gap: 30px;
            width: 100%;
            align-items: flex-start;
        }

        /* Fixed Left Sidebar Panel */
        header.sidebar-fixed {
            width: 260px;
            position: sticky;
            top: 30px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Main Content Workspace Layout Canvas */
        .content-canvas {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 🔼 TOP ROW GRID: Explicit side-by-side split for creative pods */
        .top-split-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* Exact proportions matching the bottom grid */
            gap: 24px;
            align-items: stretch;
            width: 100%;
        }

        /* 🔽 BOTTOM ROW GRID: Side-by-side split for digital & charts */
        .bottom-split-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
            align-items: stretch;
            width: 100%;
        }

        /* Unified Card Style */
        .pod-card {
            background: #2c3032;
            padding: 24px;
            border-radius: 12px;
            box-sizing: border-box;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">

        <header class="sidebar-fixed">
            <div class="stat-card">
                <span class="label">ACTIVE PROJECTS</span>
                <span class="value" id="project-count">--</span>
            </div>
            <div class="stat-card">
                <span class="label">TASKS</span>
                <div class="value-split"><span class="value" id="started-count">--</span><span class="sub-label">STARTED</span></div>
                <div class="value-split"><span class="value secondary" id="not-started-count">--</span><span class="sub-label">UPCOMING</span></div>
            </div>
            <div class="stat-card overdue-card" id="overdue-wrapper">
                <span class="label">TASKS OVERDUE</span>
                <span class="value" id="overdue-count">--</span>
            </div>
            <div class="sync-status">
                <h1 id="pulse-text">STATION ACTIVE</h1>
                <p id="last-update">Last Sync: --:--</p>
            </div>
        </header>

        <div class="content-canvas">
            
            <div class="top-split-grid">
                <div id="racers-pod-container"></div>
                
                <div id="ideafarm-pod-container"></div>
            </div>
            
            <div class="bottom-split-grid">
                <div id="digital-pod-container"></div>
                
                <div class="trend-chart-card" style="background: #2c3032; padding: 24px; border-radius: 12px; box-sizing: border-box; display: flex; flex-direction: column;">
                    <h3 style="font-size: 1.2rem; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 12px; margin-top: 0; margin-bottom: 16px; color: #F2F2F2; letter-spacing: 1px; font-weight: 600;">10-Day Task Overdue Trend</h3>
                    <div style="position: relative; width: 100%; flex-grow: 1; min-height: 240px;">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
