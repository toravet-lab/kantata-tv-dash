<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Command Center</title>
    <link rel="stylesheet" href="style.css">
    <!-- 📊 Load Chart.js CDN for the 10-Day Trend Visualizer -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #121212;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .dashboard-wrapper {
            display: flex;
            gap: 30px;
            width: 100%;
            align-items: flex-start;
        }

        /* Fixed Sidebar Alignment Control Panel */
        header.sidebar-fixed {
            width: 260px;
            position: sticky;
            top: 30px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Master Canvas Area Container */
        .content-canvas {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Top Row Stack Container (Holds Pod Racers & Idea Farm) */
        .top-pods-stack {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
        }

        /* Bottom Row Split Grid (Digital Team next to Chart) */
        .bottom-split-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* Digital Team sits slightly wider than chart */
            gap: 24px;
            align-items: stretch;
            width: 100%;
        }

        /* Dynamic Class Assignment Fixes for JavaScript target appending */
        .pod-card {
            background: #2c3032;
            padding: 24px;
            border-radius: 12px;
            box-sizing: border-box;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 🗺️ Master Outer Dashboard Grid Wrapper Container -->
    <div class="dashboard-wrapper">

        <!-- LEFT PANEL COLUMN: Control Metrics -->
        <header class="sidebar-fixed">
            <div class="stat-card">
                <span class="label">ACTIVE PROJECTS</span>
                <span class="value" id="project-count">--</span>
            </div>
            <div class="stat-card">
                <span class="label">TASKS</span>
                <div class="value-split"><span class="value" id="started-count">--</span><span class="sub-label">STARTED</span></div>
                <div class="value-split"><span class="value secondary" id="not-started-count">--</span><span class="sub-label">UPCOMING</span></div>
            </div>
            <div class="stat-card overdue-card" id="overdue-wrapper">
                <span class="label">TASKS OVERDUE</span>
                <span class="value" id="overdue-count">--</span>
            </div>
            <div class="sync-status">
                <h1 id="pulse-text">STATION ACTIVE</h1>
                <p id="last-update">Last Sync: --:--</p>
            </div>
        </header>

        <!-- RIGHT CANVAS PANEL: Interactive Layout Presentation Area -->
        <div class="content-canvas">
            
            <!-- 🔼 TOP ROW AREA: Holds Main Creative Production Pod Cards -->
            <div id="top-pods-container" class="top-pods-stack"></div>
            
            <!-- 🔽 BOTTOM ROW AREA: Side-by-Side Split Workspace Grid -->
            <div class="bottom-split-grid">
                
                <!-- Bottom Left Pane: Dedicated Dropzone for the Digital Team Card -->
                <div id="digital-pod-container"></div>
                
                <!-- Bottom Right Pane: 10-Day Overdue Trend Visualizer Card -->
                <div class="trend-chart-card" style="background: #2c3032; padding: 24px; border-radius: 12px; box-sizing: border-box; display: flex; flex-direction: column;">
                    <h3 style="font-size: 1.2rem; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 12px; margin-top: 0; margin-bottom: 16px; color: #F2F2F2; letter-spacing: 1px; font-weight: 600;">10-Day Overdue Trend</h3>
                    <div style="position: relative; width: 100%; flex-grow: 1; min-height: 240px;">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
                
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
