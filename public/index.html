<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Command Center</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 🚨 Inline layout structural patch to fix the visual card alignment */
        body {
            display: block; /* Overrides old flex rule to support structural wrapper */
            overflow-y: auto;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
        }

        .dashboard-wrapper {
            display: flex;
            gap: 40px;
            width: 100%;
            align-items: flex-start;
        }

        /* Fixed Sidebar Alignment */
        header.sidebar-fixed {
            width: 260px;
            position: sticky;
            top: 40px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: auto;
        }

        /* Right Side Content Canvas Area Splitter */
        .content-canvas {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 2fr 1fr; /* 2 parts Pod Cards to 1 part Trend Graph */
            gap: 30px;
            align-items: start;
        }

        /* Clean up standard container layout metrics override */
        #pods-container.pods-grid {
            display: grid;
            grid-template-columns: 1fr; /* Stack individual Pod groups vertically */
            gap: 30px;
            margin: 0;
            padding: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">

        <header class="sidebar-fixed">
            <div class="stat-card">
                <span class="label">ACTIVE PROJECTS</span>
                <span class="value" id="project-count">--</span>
            </div>
            <div class="stat-card">
                <span class="label">TASKS</span>
                <div class="value-split"><span class="value" id="started-count">--</span><span class="sub-label">STARTED</span></div>
                <div class="value-split"><span class="value secondary" id="not-started-count">--</span><span class="sub-label">UPCOMING</span></div>
            </div>
            <div class="stat-card overdue-card" id="overdue-wrapper">
                <span class="label">TASKS OVERDUE</span>
                <span class="value" id="overdue-count">--</span>
            </div>
            <div class="sync-status">
                <h1 id="pulse-text">STATION ACTIVE</h1>
                <p id="last-update">Last Sync: --:--</p>
            </div>
        </header>

        <div class="content-canvas">
            
            <div id="pods-container" class="pods-grid"></div>
            
            <div class="trend-chart-card" style="background: #2c3032; padding: 25px; border-radius: 12px; box-sizing: border-box; width: 100%; position: sticky; top: 40px;">
                <h3 style="font-size: 1.3rem; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 12px; margin-top: 0; margin-bottom: 20px; color: #F2F2F2; letter-spacing: 1px; font-weight: 600;">10-Day Overdue Trend</h3>
                <div style="position: relative; width: 100%; height: 320px;">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
