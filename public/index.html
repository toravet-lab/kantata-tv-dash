<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kantata TV Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="stat-box">
            <div class="stat-label">ACTIVE PROJECTS</div>
            <div class="stat-value" id="project-count">14</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">STARTED TASKS</div>
            <div class="stat-value" id="task-count">82</div>
        </div>
    </header>

    <div class="sync-header">
        <h2>Resource Availability</h2>
        <p id="last-sync-time">Last Sync: --:--</p>
    </div>

    <div id="pods-container"></div>

    <script src="script.js"></script>
</body>
</html>
